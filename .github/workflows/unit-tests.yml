name: unit tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dev environment
        uses: ./.github/actions/setup-dev-environment

      - name: run tests
        run: make rust-test

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup dev environment
        uses: ./.github/actions/setup-dev-environment

      - name: run clippy
        run: make clippy
