[workspace]
resolver = "3"
members = ["ephemeral-postgres", "ephemeral-postgres-tests"]

[workspace.dependencies]
ephemeral-postgres = { path = "ephemeral-postgres", version = "0.5.0" }
ephemeral-postgres-tests = { path = "ephemeral-postgres-tests" }
sqlx = { version = "0.9", features = ["chrono", "derive", "json", "migrate", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "watchdog"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["time"] }
uuid = { version = "1.24", features = ["serde", "v4"] }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]
test_crates = ["ephemeral-postgres-tests"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []
