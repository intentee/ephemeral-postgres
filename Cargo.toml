[workspace]
resolver = "3"
members = ["ephemeral-postgres", "ephemeral-postgres-tests"]

[workspace.dependencies]
ephemeral-postgres-tests = { path = "ephemeral-postgres-tests" }
percent-encoding = "2.3"
sqlx = { version = "0.9", features = ["derive", "json", "migrate", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt"] }
url = "2.5"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]
test_crates = ["ephemeral-postgres-tests"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []
