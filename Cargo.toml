[workspace]
resolver = "3"
members = ["ephemeral-postgres", "ephemeral-postgres-run", "ephemeral-postgres-tests"]

[workspace.dependencies]
ephemeral-postgres = { path = "ephemeral-postgres", version = "0.4.0" }
ephemeral-postgres-tests = { path = "ephemeral-postgres-tests" }
sqlx = { version = "0.9", features = ["chrono", "derive", "json", "migrate", "postgres", "runtime-tokio", "tls-native-tls", "uuid"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "watchdog"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["time"] }
uuid = { version = "1.24", features = ["serde", "v4"] }

[workspace.lints.clippy]
ignored_unit_patterns = "warn"
must_use_candidate = "warn"
